# Guarded SQL runner, GitHub Actions route. See docs/guarded-sql.md.
# Manual trigger only. Every run waits for Zach's approval in a protected
# environment; secrets live ONLY in those environments (never repo-level).
name: Guarded SQL

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "SQL file under scripts/sql/ (e.g. scripts/sql/guarded-sql-selftest.sql)"
        required: true
        type: string
      target:
        description: "Environment to run against"
        required: true
        type: choice
        options: [test, production]
        default: test
      snapshot_id:
        description: "Neon branch id (br-...). Leave empty to create a pre-run branch. A supplied id is used as before."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (no DB connection). An empty snapshot_id still creates the pre-run branch."
        required: true
        type: boolean
        default: true
      max_snapshot_age_hours:
        description: "Max snapshot age in hours (default 24)"
        required: false
        type: string
        default: "24"
      allow_schema_change:
        description: "Production only: skip the catalog statement guard. Reviewer approval is still required."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guarded-sql
  cancel-in-progress: false

jobs:
  run:
    name: guarded-sql (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # target is a choice input, so this resolves only to one of the two names.
    environment: ${{ inputs.target == 'production' && 'guarded-sql-production' || 'guarded-sql-test' }}
    env:
      IN_SQL_FILE: ${{ inputs.sql_file }}
      IN_TARGET: ${{ inputs.target }}
      IN_SNAPSHOT: ${{ inputs.snapshot_id }}
      IN_DRY_RUN: ${{ inputs.dry_run }}
      IN_MAX_AGE: ${{ inputs.max_snapshot_age_hours }}
      # Fixed workspace-relative path (logs/ is gitignored). The runner, summary and upload steps all use it.
      GUARDED_SQL_LOG: logs/guarded-sql-runs.jsonl
    steps:
      - name: Validate inputs
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROD_API_KEY: ${{ secrets.NEON_PROD_API_KEY }}
          TEST_PROJECT_ID: ${{ vars.TEST_PROJECT_ID || secrets.TEST_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${NEON_API_KEY:-}" ]]; then echo "::add-mask::$NEON_API_KEY"; fi
          if [[ -n "${NEON_PROD_API_KEY:-}" ]]; then echo "::add-mask::$NEON_PROD_API_KEY"; fi
          case "$IN_SQL_FILE" in
            *..*) echo "::error::sql_file must not contain '..'"; exit 2 ;;
          esac
          if ! [[ "$IN_SQL_FILE" =~ ^scripts/sql/[A-Za-z0-9._-]+\.sql$ ]]; then
            echo "::error::sql_file must match scripts/sql/<name>.sql"; exit 2
          fi
          if [[ -n "$IN_SNAPSHOT" && ! "$IN_SNAPSHOT" =~ ^br-[a-z0-9-]+$ ]]; then
            echo "::error::snapshot_id must look like br-..."; exit 2
          fi
          if ! [[ "$IN_MAX_AGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::max_snapshot_age_hours must be a positive number"; exit 2
          fi
          if [[ "$IN_TARGET" == "production" && "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
            echo "::error::production target only runs from refs/heads/main (github.ref is ${GITHUB_REF:-unset})"
            exit 2
          fi
          if [[ -z "$IN_SNAPSHOT" && "$IN_TARGET" == "production" && -z "${NEON_PROD_API_KEY:-}" ]]; then
            echo "::error::NEON_PROD_API_KEY is not set. Add this project-scoped key to the guarded-sql-production environment before a production run that creates its own snapshot."
            exit 2
          fi
          if [[ -z "$IN_SNAPSHOT" && "$IN_TARGET" == "test" && -z "${NEON_API_KEY:-}" ]]; then
            echo "::error::NEON_API_KEY is not set. The guarded-sql-test environment must provide it when snapshot_id is empty."
            exit 2
          fi
          if [[ -z "$IN_SNAPSHOT" && "$IN_TARGET" == "test" && -z "${TEST_PROJECT_ID:-}" ]]; then
            echo "::error::TEST_PROJECT_ID is not set. The guarded-sql-test environment must provide it when snapshot_id is empty."
            exit 2
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Check file exists
        shell: bash
        run: |
          set -euo pipefail
          test -f "$IN_SQL_FILE" || { echo "::error::sql_file not found in this commit"; exit 2; }

      - name: Catalog statement guard
        if: inputs.target == 'production' && inputs.allow_schema_change == false
        shell: bash
        run: npx --no-install tsx scripts/guarded-sql-statement-guard.ts

      - name: Create pre-run snapshot
        id: snap
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROD_API_KEY: ${{ secrets.NEON_PROD_API_KEY }}
          TEST_PROJECT_ID: ${{ vars.TEST_PROJECT_ID || secrets.TEST_PROJECT_ID }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
        run: npx --no-install tsx scripts/guarded-sql-self-snapshot.ts

      - name: Run guarded SQL
        shell: bash
        env:
          GUARDED_DATABASE_URL: ${{ secrets.GUARDED_DATABASE_URL }}
          NEON_API_KEY: ${{ steps.snap.outputs.key_slot == 'prod' && secrets.NEON_PROD_API_KEY || secrets.NEON_API_KEY }}
          NEON_PROD_API_KEY: ${{ secrets.NEON_PROD_API_KEY }}
          NEON_PROJECT_ID: ${{ steps.snap.outputs.snapshot_project }}
          GUARDED_SQL_SNAPSHOT_PARENT: ${{ steps.snap.outputs.snapshot_parent }}
          RESOLVED_SNAPSHOT: ${{ steps.snap.outputs.snapshot_id }}
          CONFIRM_PROD_HOST: ${{ secrets.CONFIRM_PROD_HOST || vars.CONFIRM_PROD_HOST }}
          GUARDED_SQL_CATALOG_GUARD: ${{ inputs.target == 'production' && inputs.allow_schema_change == false && '1' || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${NEON_API_KEY:-}" ]]; then echo "::add-mask::$NEON_API_KEY"; fi
          if [[ -n "${NEON_PROD_API_KEY:-}" ]]; then echo "::add-mask::$NEON_PROD_API_KEY"; fi
          if [[ -z "${RESOLVED_SNAPSHOT:-}" ]]; then
            echo "::error::no snapshot id (create step did not return one)"; exit 2
          fi
          if [[ ! "$RESOLVED_SNAPSHOT" =~ ^br-[a-z0-9-]+$ ]]; then
            echo "::error::snapshot id must look like br-..."; exit 2
          fi
          args=("$IN_SQL_FILE" --max-snapshot-age-hours "$IN_MAX_AGE" --snapshot "$RESOLVED_SNAPSHOT")
          if [[ "$IN_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$IN_TARGET" == "production" ]]; then args+=(--confirm-production); fi
          npx --no-install tsx scripts/run-guarded-sql.ts "${args[@]}"

      - name: Job summary and log secret check
        if: always()
        id: summary
        shell: bash
        env:
          GUARDED_DATABASE_URL: ${{ secrets.GUARDED_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROD_API_KEY: ${{ secrets.NEON_PROD_API_KEY }}
          GUARDED_SQL_SNAPSHOT_NAME: ${{ steps.snap.outputs.snapshot_name }}
          GUARDED_SQL_SNAPSHOT_ID: ${{ steps.snap.outputs.snapshot_id }}
          GUARDED_SQL_SCHEMA_OVERRIDE: ${{ inputs.target == 'production' && inputs.allow_schema_change && 'true' || 'false' }}
        run: node scripts/guarded-sql-gha-summary.mjs

      - name: Upload redacted run log
        if: always() && steps.summary.outputs.log_clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guarded-sql-run-log-${{ github.run_id }}
          path: logs/guarded-sql-runs.jsonl
          retention-days: 3
          if-no-files-found: ignore
